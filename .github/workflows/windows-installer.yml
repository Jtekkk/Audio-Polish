name: Windows Installer

# Builds the plugin on Windows (MSVC), then packages a Windows installer with
# Inno Setup. The installer is uploaded as a build artifact, and attached to a
# GitHub Release when a v* tag is pushed.

on:
  push:
    branches: [ main, master, 'claude/**' ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the installer to a Release on tags

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME -replace '^v',''
          } else {
            $v = '1.0.0-dev+' + $env:GITHUB_SHA.Substring(0,7)
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version: $v"

      # Set up MSVC explicitly rather than relying on a specific Visual Studio
      # generator, which breaks whenever the hosted runner image bumps its VS
      # version. msvc-dev-cmd + Ninja works with whatever MSVC the image ships.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Configure (CMake + Ninja)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: cmake --build build --parallel

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & "$iscc" "/DAppVersion=${{ steps.ver.outputs.version }}" "installer\AudioPolish.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioPolish-Windows-Installer
          path: installer/Output/*.exe
          if-no-files-found: error

      - name: Attach installer to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
